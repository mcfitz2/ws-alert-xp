; BTstack HFP-AG PTT firmware for the classic ESP32 (BR/EDR required).
; Example: ws6_ptt library (../../ws6_ptt) + FM-commentary stand-in + radio PTT.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
extra_scripts = pre:../../tools/set_btstack_root.py
monitor_speed = 115200
; PlatformIO must also list files that src/CMakeLists.txt embeds (EMBED_FILES).
board_build.embed_files = src/commentary.ul
board_build.partitions = partitions.csv
