; ESP32 HFP-AG "radio PTT" dongle for the 3M Peltor WS Alert XP.
;
; Phase A: prove the protocol on bare hardware. The ESP32 acts as an HFP
; Audio Gateway, runs the WS6 radio-mode handshake (real +VOLOUT reply, SCO
; up), and mirrors the headset's talk-key (AT+CTKST) onto a GPIO. No radio and
; no K1 plug needed for this phase: watch the LED follow the Bluetooth button.
;
; Needs the *original* ESP32 (BR/EDR classic). S3/S2/C3/C6 cannot do HFP-AG.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
; Adjust these to match the port the board enumerates on.
upload_port = /dev/cu.usbserial-8430
monitor_port = /dev/cu.usbserial-8430
