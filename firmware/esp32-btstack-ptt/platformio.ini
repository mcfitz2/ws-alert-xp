; BTstack HFP-AG PTT firmware for the classic ESP32 (BR/EDR required).
; See main/hfp_ptt.c for what it does.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
extra_scripts = pre:set_btstack_root.py
monitor_speed = 115200
upload_port = /dev/cu.usbserial-8430
monitor_port = /dev/cu.usbserial-8430
