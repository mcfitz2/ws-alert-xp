; BTstack HFP-AG PTT firmware for the classic ESP32 (BR/EDR required).
; Bluetooth side: components/ws6_ptt. Application: src/app.c.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
extra_scripts = pre:set_btstack_root.py
monitor_speed = 115200
upload_port = /dev/cu.usbserial-8430
monitor_port = /dev/cu.usbserial-8430
; PlatformIO must also list files that src/CMakeLists.txt embeds (EMBED_FILES).
board_build.embed_files = src/commentary.ul
board_build.partitions = partitions.csv
